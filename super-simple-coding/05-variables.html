<!DOCTYPE html>
<html>
  <head>
    <title>Variable</title>
  </head>
  <body>
    <script>
      //variable declaration
      let variable1 = 3;
      console.log(variable1);

      const calculation = 2 + 2;
      console.log(calculation);
      console.log(calculation + 2);

      const result = calculation + 2;
      console.log(result);

      const message = 'Hello';
      console.log(message); console.log(';');

      variable1 = 5;
      console.log(variable1);

      variable1 = variable1 + 1;
      console.log(variable1);

      // const means we cant change the value after assigning it 
      const variable2 = 3;
      //var is old and it has some issues later on it doesnt create a scope in if and else conditions
      var variable3 = 3;
      console.log(typeof variable2);
      console.log(typeof message)
    </script>
  </body>
</html>
