<!DOCTYPE html>
<html>
<head>
  <title>9e-9f</title>
</head>
<body>
  <input class="js-name-textbox" type="text" placeholder="Name" onkeydown="
    displayNameKeydown();
  ">
  <button class="js-submit-button" onclick="
    displayName();
  ">Submit</button>
  <p class="js-name-display"></p>
  <script>
    function displayNameKeydown(){
      if(event.key === 'Enter'){
        displayName();
      }
    }

    function displayName(){
      document.querySelector('.js-name-display').innerHTML = `Your name is: ${document.querySelector('.js-name-textbox').value}`;
    }
  </script>
</body>
</html>
