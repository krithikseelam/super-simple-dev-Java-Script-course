<!DOCTYPE html>
<html>
<head>
  <title>12f</title>
</head>
<body>
  <button class="js-add-to-cart-button">Add to cart</button>
  <p class="js-add-to-cart-display"></p>
  <script>
    let timeOutID;
    const buttonElement = document.querySelector('.js-add-to-cart-button');
    buttonElement.addEventListener('click',() => {
      addToCart();
    })

    function addToCart(){
      const display = document.querySelector('.js-add-to-cart-display');
      display.innerHTML = 'Added';

      clearTimeout(timeOutID);

      timeOutID = setTimeout(() =>{
        display.innerHTML = '';
      },2000);
      
    }
  </script>
</body>
</html>
