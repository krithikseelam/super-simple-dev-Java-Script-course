<!DOCTYPE html>
<html>
  <head>
    <title>App</title>
  </head>
  <body>
    <button class="js-add-button">Add</button>

    <button class="js-remove-button">Remove</button>

    <script>
      let messages = 2;

      let intervalId;

      let isDisplayingNotification;
      const addButtonElement = document.querySelector('.js-add-button');
      const removeButtonElement = document.querySelector('.js-remove-button');
      
      addButtonElement.addEventListener('click',() => {
        messages++;
        displayNotification();
      })

      removeButtonElement.addEventListener('click',() => {
        messages--;
      })

      displayNotification();

      function displayNotification() {
        if (messages === 0) {
          return;
        }

        if(isDisplayingNotification){
          return;
        }

        isDisplayingNotification = true;

        intervalId = setInterval(() => {
          if (document.title === 'App') {
            document.title = `(${messages}) New messages`;
          } else {
            document.title = 'App';
          }
        }, 1000);
      }

      function stopNotification() {
        isDisplayingNotification = false;

        clearInterval(intervalId);
        document.title = 'App';
      }
    </script>
  </body>
</html>
