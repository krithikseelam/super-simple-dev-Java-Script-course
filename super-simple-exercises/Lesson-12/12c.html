<!DOCTYPE html>
<html>
<head>
  <title>12c</title>
</head>
<body>
  <button class="start-button" onclick="
    displayFinished();
  ">Start</button>
  <script>
    function displayFinished(){
      const button = document.querySelector('.start-button');
      setTimeout(function(){
        button.innerHTML = 'Finished!';
      },1000);
    }

  </script>
</body>
</html>
