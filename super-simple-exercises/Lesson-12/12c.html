<!DOCTYPE html>
<html>
<head>
  <title>12c</title>
</head>
<body>
  <button class="start-button">Start</button>
  <script>
    const button = document.querySelector('.start-button');
    button.addEventListener('click',() => {
      displayFinished();
    })
    function displayFinished(){
      setTimeout(() => {
        button.innerHTML = 'Finished!';
      },1000);
    }

  </script>
</body>
</html>
