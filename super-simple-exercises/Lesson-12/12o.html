<!DOCTYPE html>
<html>
  <head>
    <title>12o</title>
  </head>
  <body>

    <script>
      const removeEgg = (array) => {
        let remove_count = 2;
        return array.filter((value) => {
          if(value == 'egg' && remove_count > 0){
            remove_count--;
            return false;
          }else {
            return true;
          }
        })
      }
      console.log(removeEgg(['egg','apple','egg','egg','chicken']));
      
    </script>
  </body>
</html>
